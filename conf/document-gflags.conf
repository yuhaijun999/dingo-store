# ======================================================================
# [GC-Tombstone] Baseline feature flags, enabled for testing. Each group is
# labeled with the commit that introduced it. To roll back: delete the group,
# or set the bool to false / the seconds to 0.
# ======================================================================

# [5e28832] step1: txn scan tombstone observability metrics.
# next_tombstone also needs enable_rocksdb_perf_metric=true (pre-existing flag).
-txn_scan_tombstone_metric=true
-enable_rocksdb_perf_metric=true

# [df0410d] step2: write CF compaction filter (drops expired MVCC versions with 0 tombstone).
-gc_enable_compaction_filter=true

# [b68a78b] step3: periodic compaction on write CF to feed the filter (0 = off; 300s for testing, tunable).
-gc_periodic_compaction_seconds=300

# [db7bf1f] step4: range-scoped CompactRange wrapper -- no gflag (pure plumbing).

# [c66893e] step5: active CompactRange after raft GC (master switch + throttling).
-gc_enable_active_compaction=true
-gc_active_compaction_every_n_rounds=5
-gc_active_compaction_round_budget_ms=30000
-gc_active_compaction_max_per_round=16
-gc_active_compaction_min_interval_s=3600
-gc_active_compaction_force_bottommost=true

# [6566873] step6: adaptive seek in txn scan read path.
# WARNING: keep this OFF (false) when measuring the compaction-filter benefit alone (single-variable);
# adaptive seek also speeds up scans and would confound the filter measurement.
-txn_scan_adaptive_seek=true
-txn_scan_seek_bound=8

# [e2ed4e7] step7: DeleteFilesInRange + per-key fallback for large-range deletes (lock CF still DeleteRange).
-gc_use_delete_files_in_range=true

# [A/B] Move all txn values into the write CF (inline) so the write-CF optimization covers 100% of the
# data and the data CF is not a confounding variable in the A/B test. INT64_MAX means no value is ever
# large enough to be spilled to the data CF, so txn Put never writes the data CF. Pre-existing flag
# (default 256), NOT from the 8 GC-tombstone commits. Set this BEFORE loading test data; existing data
# CF entries are not migrated. Roll back by removing this line (default 256 restores the normal split).
-max_short_value_in_write_cf=9223372036854775807
